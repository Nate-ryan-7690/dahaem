# Per-test safety timeout. No unit/integration test here should run for minutes: the
# Testcontainers MariaDB starts once per JVM (well under a minute) and the tests themselves
# are in-memory or single-query. A test that exceeds this is hung (e.g. an un-timed network
# call or a thread join that never returns); failing it fast — and naming the exact method and
# its stack — beats letting the forked JVM, and with it CI, block indefinitely.
#
# Applies to @Test/@BeforeAll/@AfterAll/@BeforeEach/@AfterEach. Container startup happens inside
# the first test that touches the database, so the budget is generous enough to absorb it.
junit.jupiter.execution.timeout.default = 2 m
