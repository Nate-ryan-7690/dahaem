# Tests start the API without the production secrets (Testcontainers supplies the database, and most tests exercise the
# session login without the internal token), so the fail-closed start-up check (StartupGuard) is off here. This file is
# in src/test/resources only: it is not in the jar.
dahaem.require-secrets=false
# the cheapest BCrypt cost, so tests that make hashes stay fast
dahaem.auth.bcrypt-strength=4
