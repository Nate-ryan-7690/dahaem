# DAHÄM API configuration.
#
# The REST API has NO authentication/authorization yet, so it must not be reachable
# from the LAN or the internet. Bind it to loopback only until auth (Spring Security +
# household/user tables) is added. See docs/VISION.md.
#
# When auth exists, this can move to 0.0.0.0 behind a reverse proxy (Caddy/nginx) with TLS.
server.address=127.0.0.1
server.port=8080
