# DAHÄM API configuration.
#
# Every /api/** endpoint now requires a login (Spring Security session login, see
# de.dahaem.api.SecurityConfig); create accounts with de.dahaem.auth.UserAdminRunner.
#
# The default stays loopback-only, so a fresh install is never reachable from the network
# by accident. With auth in place the operator MAY bind to all interfaces, but only behind
# a reverse proxy (Caddy/nginx) that terminates TLS: passwords and the session cookie must
# never travel over plain HTTP. For that setup, override (e.g. with -D... or an external
# application.properties) rather than editing this file:
#   server.address=0.0.0.0                  (or keep 127.0.0.1 if the proxy runs on the same host)
#   server.forward-headers-strategy=native  so the app sees the proxy's https scheme
#   server.servlet.session.cookie.secure=true
# See docs/VISION.md ("Running it on the network").
server.address=127.0.0.1
server.port=8080

# Login session: the household's phones should not have to log in again every half hour.
# Sessions live in memory, so a restart of the app logs everyone out.
server.servlet.session.timeout=14d
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
