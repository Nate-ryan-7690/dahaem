# DAHÄM API configuration.
#
# Every /api/** endpoint now requires a login (Spring Security session login, see
# de.dahaem.api.SecurityConfig); create accounts with de.dahaem.auth.UserAdminRunner.
#
# The default stays loopback-only, so a fresh install is never reachable from the network
# by accident. With auth in place the operator MAY bind to all interfaces, but only behind
# a reverse proxy (Caddy/nginx) that terminates TLS: passwords and the session cookie must
# never travel over plain HTTP. For that setup, override (e.g. with -D... or an external
# application.properties) rather than editing this file:
#   server.address=0.0.0.0                  (or keep 127.0.0.1 if the proxy runs on the same host)
#   server.forward-headers-strategy=native  so the app sees the proxy's https scheme
#   server.servlet.session.cookie.secure=true
# See docs/VISION.md ("Running it on the network").
server.address=127.0.0.1
server.port=8080

# Login session: the household's phones should not have to log in again every half hour.
# Sessions live in memory, so a restart of the app logs everyone out.
server.servlet.session.timeout=14d
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Shared secret between the PHP front end and this API (header X-Internal-Token). Every /api/** request must carry it.
# FAIL CLOSED: the API refuses to start when INTERNAL_API_TOKEN or DAHAEM_DB_URL / DAHAEM_DB_USER / DAHAEM_DB_PASSWORD is
# missing or blank (de.dahaem.api.StartupGuard). For local development only: -Ddahaem.require-secrets=false (then an
# empty token leaves just the session login above).
dahaem.internal-token=${INTERNAL_API_TOKEN:}
dahaem.require-secrets=true

# Password hashes: BCrypt cost (12 = about 0.25 s per login check). Hashes made with a lower cost are made again with this
# one at the user's next successful login.
dahaem.auth.bcrypt-strength=12

# The real client address comes from the PHP front end in the X-Client-Ip header (believed only together with the
# internal token) and appears in the audit log (logger "audit"): logins, failed logins, writes, refused requests, together
# with the id of the logged-in user from the X-Acting-User header (same rule).

# Barcode lookups of numbers DAHÄM does not know: off unless DAHAEM_BARCODE_LOOKUP=openfoodfacts. Only the number is sent.
# At most this many outside lookups per minute for the whole API.
dahaem.barcode.lookups-per-minute=${DAHAEM_BARCODE_LOOKUPS_PER_MINUTE:30}

# Scheduled store-data refresh (de.dahaem.stores.ScheduledRefresh, see docs/refresh.md).
# OFF by default so dev, tests and CI never scrape external sites. Enable in the dahaem-api
# container with REFRESH_ENABLED=true (or dahaem.refresh.enabled=true).
# Cron format is Spring's 6 fields: second minute hour day-of-month month day-of-week.
# The "weekly" offers flow runs daily: chains publish new flyers on different days (Penny shows
# next week from Friday), and re-pulling an offer updates its row instead of adding one.
dahaem.refresh.enabled=${REFRESH_ENABLED:false}
dahaem.refresh.weekly-cron=${REFRESH_WEEKLY_CRON:0 0 6 * * *}
dahaem.refresh.monthly-cron=${REFRESH_MONTHLY_CRON:0 0 5 1 * *}
dahaem.refresh.zone=${REFRESH_ZONE:Europe/Berlin}

# Meal planner: "today" (which days are past) is the date in the household's time zone. Meals of past days cannot be
# changed, and a nightly job (00:01, Spring's 6-field cron) writes their resolved servings onto them so history stops
# following the household number (de.dahaem.api.ScheduledMealServings). On by default; it touches no external site.
dahaem.mealplan.zone=${MEALPLAN_ZONE:Europe/Berlin}
dahaem.mealplan.freeze-enabled=${MEALPLAN_FREEZE_ENABLED:true}
dahaem.mealplan.freeze-cron=${MEALPLAN_FREEZE_CRON:0 1 0 * * *}
