# Thresholds for the derived recipe tags (RecipeTagRunner). All values are per serving, as the recipe
# nutrition columns are. Confirmed by Nate on 2026-10-13. A missing key uses the default shown.

# "schnell": recipe_prep_time + recipe_cook_time (minutes) at most this; only when the total is above 0
# (imported recipes store HelloFresh's total time as cook time and 0 as prep time).
quick.max.minutes=30

# "kalorienarm": recipe_calories (kcal per serving) at most this.
low-calorie.max.kcal=600

# "proteinreich": the EU rule for the claim "high protein" (Regulation (EC) No 1924/2006, Annex): at least 20 % of
# the energy value from protein, protein counted as 4 kcal per gram (protein_g * 4 / kcal >= share). Decided by Nate on
# 2026-10-14, together with a minimum amount: BOTH must hold, per serving. The share is a fraction (0.20 = 20 %);
# it replaces the old single threshold high-protein.min.grams=30.
high-protein.energy.share=0.20
high-protein.min.grams=20
