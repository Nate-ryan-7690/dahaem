name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard cap enforced by GitHub itself: a healthy run takes ~1-2 min, so a job that is
    # still going at 15 min is hung and gets killed, whatever the JVM is doing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Recipe importer / repair tool: parser and repair-SQL tests on saved fixtures
      # (stdlib unittest; no database, no network, no extra packages).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/importer/tests -v
      # Doc generator (class diagrams, API reference): reader and generators on a made-up source tree.
      - run: python -m unittest discover -s scripts/docs/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # No -q: print per-class test progress so a hang is diagnosable from the log
      # (the last "Running de.dahaem.…Test" line is the class that stalled).
      - run: mvn -B -DskipTests=false verify
